<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc"><title id="title">Architecture evolution to P1</title><desc id="desc">Four development stages, from historical BODY2 and FM-C to BODY3, K3 ACT-E shared optics and current P1 implementation hold.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507483"/></marker></defs><rect width="1440" height="680" fill="#f5f8fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="49" font-size="18" fill="#278d83" font-weight="700">ARCHITECTURE EVOLUTION</text><text x="40" y="96" font-size="33" fill="#163449" font-weight="700">From modular studies to the first functional camera</text><text x="40" y="132" font-size="20" fill="#45616f" font-weight="400">Milestone sequence • Historical evidence retained • Physical system still unverified</text><text x="40" y="191" font-size="17" fill="#278d83" font-weight="700">01 / HISTORICAL</text><rect x="40" y="211" width="312" height="163" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="246" font-size="21" fill="#163449" font-weight="650">BODY2 + FM-C</text><text x="60" y="277" font-size="17" fill="#45616f" font-weight="400">Copal in each lens</text><text x="60" y="302" font-size="17" fill="#45616f" font-weight="400">Front closure HOLD</text><text x="60" y="327" font-size="17" fill="#45616f" font-weight="400">Earlier format ambition</text><path d="M 354 290 L 379 290" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="385" y="191" font-size="17" fill="#278d83" font-weight="700">02 / NEW BODY</text><rect x="385" y="211" width="312" height="163" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="405" y="246" font-size="21" fill="#163449" font-weight="650">BODY3 + K3</text><text x="405" y="277" font-size="17" fill="#45616f" font-weight="400">645-class direction</text><text x="405" y="302" font-size="17" fill="#45616f" font-weight="400">Body-mounted shutter</text><text x="405" y="327" font-size="17" fill="#45616f" font-weight="400">Fixed rear datum + D3</text><path d="M 699 290 L 724 290" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="730" y="191" font-size="17" fill="#278d83" font-weight="700">03 / INTEGRATION</text><rect x="730" y="211" width="312" height="163" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="750" y="246" font-size="21" fill="#163449" font-weight="650">ACT-E + H2</text><text x="750" y="277" font-size="17" fill="#45616f" font-weight="400">Shared moving iris</text><text x="750" y="302" font-size="17" fill="#45616f" font-weight="400">One Optical Insert</text><text x="750" y="327" font-size="17" fill="#45616f" font-weight="400">GEN1 concept / compact</text><path d="M 1044 290 L 1069 290" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="1075" y="191" font-size="17" fill="#278d83" font-weight="700">04 / CURRENT</text><rect x="1075" y="211" width="312" height="163" rx="14" fill="#fff4df" stroke="#cb9137" stroke-width="2"/><text x="1095" y="246" font-size="21" fill="#163449" font-weight="650">P1 FUNCTION FIRST</text><text x="1095" y="277" font-size="17" fill="#45616f" font-weight="400">IMPL02 shutter HOLD</text><text x="1095" y="302" font-size="17" fill="#45616f" font-weight="400">Function and evidence first</text><text x="1095" y="327" font-size="17" fill="#45616f" font-weight="400">Lightweight redesign deferred</text><rect x="40" y="414" width="1347" height="140" rx="14" fill="#e6f3f1" stroke="#278d83" stroke-width="2"/><text x="62" y="450" font-size="24" fill="#163449" font-weight="700">Retained principles</text><text x="62" y="486" font-size="20" fill="#45616f" font-weight="400">Direct optical scene • Independent rear datum • Modular adapter • Positioning separate from clamping</text><text x="62" y="521" font-size="19" fill="#45616f" font-weight="400">Current assistance: electronic frameline + three focus cues + independent ranging; details on body display</text><text x="40" y="601" font-size="20" fill="#45616f" font-weight="400">History preserved: BODY2 / FM2 / relay / SIDE / HUD / VF / SYS studies</text><text x="40" y="642" font-size="22" fill="#835b1d" font-weight="700">Current gate: IMPLEMENTATION HOLD — NOT READY FOR CONTROLLED BENCH PLANNING</text></g></svg>
