<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="710" viewBox="0 0 1450 710" role="img" aria-labelledby="title desc"><title id="title">P1 system architecture</title><desc id="desc">Functional system chain and parallel viewing, ranging and control responsibilities. Physical verification incomplete.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507483"/></marker></defs><rect width="1450" height="710" fill="#f5f8fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="43" font-size="18" fill="#278d83" font-weight="700">MODULAR MEDIUM FORMAT CAMERA</text><text x="40" y="93" font-size="38" fill="#163449" font-weight="700">P1 Functional Prototype Development</text><text x="40" y="126" font-size="21" fill="#45616f" font-weight="400">645-class maximum optical architecture  /  FUNCTION FIRST</text><rect x="40" y="164" width="180" height="122" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="199" font-size="21" fill="#163449" font-weight="650">Optical Insert</text><text x="60" y="230" font-size="17" fill="#45616f" font-weight="400">One reference lens</text><text x="60" y="255" font-size="17" fill="#45616f" font-weight="400">Real optics required</text><path d="M 221 225 L 235 225" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="238" y="164" width="180" height="122" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="258" y="199" font-size="21" fill="#163449" font-weight="650">Universal Iris</text><text x="258" y="230" font-size="17" fill="#45616f" font-weight="400">Shared aperture</text><text x="258" y="255" font-size="17" fill="#45616f" font-weight="400">Moves with focus</text><path d="M 419 225 L 433 225" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="436" y="164" width="180" height="122" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="456" y="199" font-size="21" fill="#163449" font-weight="650">FOCUS-H2</text><text x="456" y="230" font-size="17" fill="#45616f" font-weight="400">Manual focus</text><text x="456" y="255" font-size="17" fill="#45616f" font-weight="400">Non-rotating cage</text><path d="M 617 225 L 631 225" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="634" y="164" width="180" height="122" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="654" y="199" font-size="21" fill="#163449" font-weight="650">BODY3</text><text x="654" y="230" font-size="17" fill="#45616f" font-weight="400">Structural host</text><text x="654" y="255" font-size="17" fill="#45616f" font-weight="400">Fixed rear datum</text><path d="M 815 225 L 829 225" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="832" y="164" width="180" height="122" rx="14" fill="#fff4df" stroke="#cb9137" stroke-width="2"/><text x="852" y="199" font-size="21" fill="#163449" font-weight="650">K3 / ACT-E</text><text x="852" y="230" font-size="17" fill="#45616f" font-weight="400">Body focal-plane</text><text x="852" y="255" font-size="17" fill="#45616f" font-weight="400">shutter — HOLD</text><path d="M 1013 225 L 1027 225" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="1030" y="164" width="180" height="122" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="1050" y="199" font-size="21" fill="#163449" font-weight="650">Rear Adapter</text><text x="1050" y="230" font-size="17" fill="#45616f" font-weight="400">Modular interface</text><text x="1050" y="255" font-size="17" fill="#45616f" font-weight="400">Registration open</text><path d="M 1211 225 L 1225 225" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="1228" y="164" width="180" height="122" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="1248" y="199" font-size="21" fill="#163449" font-weight="650">DM22</text><text x="1248" y="230" font-size="17" fill="#45616f" font-weight="400">P1 digital back</text><text x="1248" y="255" font-size="17" fill="#45616f" font-weight="400">Sync unverified</text><text x="40" y="317" font-size="18" fill="#45616f" font-weight="400">Functional chain; iris and insert are carried by H2. Shutter belongs to BODY3.</text><rect x="40" y="351" width="330" height="118" rx="14" fill="#e6f3f1" stroke="#278d83" stroke-width="2"/><text x="60" y="386" font-size="21" fill="#163449" font-weight="650">D3 Direct Optical Finder</text><text x="60" y="417" font-size="17" fill="#45616f" font-weight="400">Optical scene viewing</text><text x="60" y="442" font-size="17" fill="#45616f" font-weight="400">Physical viewing evidence required</text><rect x="399" y="351" width="396" height="118" rx="14" fill="#e6f3f1" stroke="#278d83" stroke-width="2"/><text x="419" y="386" font-size="21" fill="#163449" font-weight="650">Electronic Frameline + Three Cues</text><text x="419" y="417" font-size="17" fill="#45616f" font-weight="400">NEAR / OK / FAR concept</text><text x="419" y="442" font-size="17" fill="#45616f" font-weight="400">Detailed information on body display</text><rect x="824" y="351" width="384" height="118" rx="14" fill="#e6f3f1" stroke="#278d83" stroke-width="2"/><text x="844" y="386" font-size="21" fill="#163449" font-weight="650">Electronic Range Assist</text><text x="844" y="417" font-size="17" fill="#45616f" font-weight="400">Subject distance + actual q</text><text x="844" y="442" font-size="17" fill="#45616f" font-weight="400">+ lens calibration → focus guidance</text><text x="40" y="512" font-size="21" fill="#163449" font-weight="650">Body Electronics / Control coordinates sensing, iris, exposure, power and UI.</text><rect x="40" y="543" width="1368" height="93" rx="14" fill="#fff4df" stroke="#cb9137" stroke-width="2"/><text x="60" y="578" font-size="24" fill="#835b1d" font-weight="700">IMPLEMENTATION HOLD — NOT READY FOR CONTROLLED BENCH PLANNING</text><text x="60" y="610" font-size="18" fill="#835b1d" font-weight="400">Main-power-loss close: under study. Total-energy-loss autonomous close: NOT CLOSED / NOT VALIDATED.</text><text x="40" y="674" font-size="18" fill="#45616f" font-weight="400">Concept relationships only • No manufacturing geometry • Lightweight product redesign follows P1 validation</text></g></svg>
