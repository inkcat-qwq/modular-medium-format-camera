<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">BODY3 whole-camera concept</title><desc id="desc">Abstract group relationships, not CAD. Shared iris and Optical Insert move within H2; BODY3 carries shutter and fixed rear datum; D3 views the scene independently.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507483"/></marker></defs><rect width="1440" height="800" fill="#f5f8fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="18" fill="#278d83" font-weight="700">BODY3 / WHOLE-CAMERA CONCEPT</text><text x="40" y="94" font-size="34" fill="#163449" font-weight="700">Shared functions, replaceable optical carrier</text><text x="40" y="127" font-size="20" fill="#45616f" font-weight="400">Abstract relationship view • Not actual geometry, scale or a finished product enclosure</text><rect x="40" y="306" width="490" height="235" rx="22" fill="#e6f3f1" stroke="#278d83" stroke-width="2"/><text x="61" y="340" font-size="25" fill="#163449" font-weight="700">FOCUS-H2</text><text x="61" y="369" font-size="20" fill="#45616f" font-weight="400">Manual ring → non-rotating moving cage</text><rect x="62" y="396" width="204" height="119" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="82" y="431" font-size="21" fill="#163449" font-weight="650">Optical Insert</text><text x="82" y="462" font-size="17" fill="#45616f" font-weight="400">One reference lens</text><text x="82" y="487" font-size="17" fill="#45616f" font-weight="400">Datums / lock open</text><rect x="288" y="396" width="220" height="119" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="308" y="431" font-size="21" fill="#163449" font-weight="650">Universal Iris</text><text x="308" y="462" font-size="17" fill="#45616f" font-weight="400">Shared aperture</text><text x="308" y="487" font-size="17" fill="#45616f" font-weight="400">Moves with cage</text><rect x="566" y="277" width="323" height="292" rx="22" fill="#eaf0f5" stroke="#809cab" stroke-width="2"/><text x="589" y="316" font-size="26" fill="#163449" font-weight="700">BODY3</text><text x="589" y="346" font-size="19" fill="#45616f" font-weight="400">Fixed structural host</text><rect x="590" y="377" width="275" height="137" rx="14" fill="#fff4df" stroke="#cb9137" stroke-width="2"/><text x="610" y="412" font-size="21" fill="#163449" font-weight="650">K3 / ACT-E Shutter</text><text x="610" y="443" font-size="17" fill="#45616f" font-weight="400">Flexible dual curtains</text><text x="610" y="468" font-size="17" fill="#45616f" font-weight="400">IMPLEMENTATION HOLD</text><rect x="572" y="165" width="310" height="94" rx="14" fill="#e6f3f1" stroke="#278d83" stroke-width="2"/><text x="592" y="200" font-size="21" fill="#163449" font-weight="650">D3 Shoulder Finder</text><text x="592" y="231" font-size="17" fill="#45616f" font-weight="400">Separate direct optical scene</text><rect x="929" y="335" width="218" height="148" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="949" y="370" font-size="21" fill="#163449" font-weight="650">Rear Interface</text><text x="949" y="401" font-size="17" fill="#45616f" font-weight="400">Fixed body datum</text><text x="949" y="426" font-size="17" fill="#45616f" font-weight="400">Modular adapter</text><text x="949" y="451" font-size="17" fill="#45616f" font-weight="400">Real registration open</text><rect x="1187" y="335" width="205" height="148" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="1207" y="370" font-size="21" fill="#163449" font-weight="650">DM22</text><text x="1207" y="401" font-size="17" fill="#45616f" font-weight="400">Own power</text><text x="1207" y="426" font-size="17" fill="#45616f" font-weight="400">Processing / storage</text><text x="1207" y="451" font-size="17" fill="#45616f" font-weight="400">Sync unverified</text><path d="M 530 457 L 562 457" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 889 457 L 925 457" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M 1147 457 L 1183 457" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="42" y="600" font-size="21" fill="#163449" font-weight="650">Direct actual q sensing</text><text x="42" y="631" font-size="18" fill="#45616f" font-weight="400">Measure actual cage position;</text><text x="42" y="657" font-size="18" fill="#45616f" font-weight="400">ring angle is not a substitute.</text><text x="565" y="600" font-size="21" fill="#163449" font-weight="650">Parallel assistance</text><text x="565" y="631" font-size="18" fill="#45616f" font-weight="400">Electronic frameline + three small focus cues</text><text x="565" y="657" font-size="18" fill="#45616f" font-weight="400">Independent ranging; detailed UI on body display</text><rect x="40" y="699" width="1352" height="62" rx="14" fill="#fff4df" stroke="#cb9137" stroke-width="2"/><text x="60" y="738" font-size="22" fill="#835b1d" font-weight="650">P1 FUNCTION FIRST • Mechanisms, optics, interfaces and safety still need physical evidence.</text></g></svg>
