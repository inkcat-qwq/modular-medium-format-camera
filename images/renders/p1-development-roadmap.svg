<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1310" viewBox="0 0 1130 1310" role="img" aria-labelledby="title desc"><title id="title">P1 development roadmap</title><desc id="desc">P1-01 shutter through P1-07 controlled release planning. Current shutter implementation hold. Product lightweight redesign follows actual P1 validation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#507483"/></marker></defs><rect width="1130" height="1310" fill="#f5f8fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="48" font-size="18" fill="#278d83" font-weight="700">P1 EVIDENCE ROADMAP</text><text x="40" y="97" font-size="34" fill="#163449" font-weight="700">Function before product optimization</text><text x="40" y="133" font-size="19" fill="#45616f" font-weight="400">Development order and evidence dependencies • No calendar dates or automatic release</text><rect x="40" y="168" width="1050" height="115" rx="14" fill="#fff4df" stroke="#cb9137" stroke-width="2"/><text x="60" y="206" font-size="23" fill="#278d83" font-weight="700">P1-01</text><text x="183" y="203" font-size="24" fill="#163449" font-weight="650">Shutter Implementation</text><text x="183" y="233" font-size="18" fill="#45616f" font-weight="400">Drive, sensing, controlled close, assembly and service</text><text x="183" y="262" font-size="15" fill="#835b1d" font-weight="700">CURRENT: IMPLEMENTATION HOLD</text><path d="M 96 284 L 96 305" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="40" y="308" width="1050" height="115" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="346" font-size="23" fill="#278d83" font-weight="700">P1-02</text><text x="183" y="343" font-size="24" fill="#163449" font-weight="650">FOCUS-H2 Mechanism</text><text x="183" y="373" font-size="18" fill="#45616f" font-weight="400">Actual motion, support, retention and direct q sensing</text><text x="183" y="402" font-size="15" fill="#45616f" font-weight="700">DETAIL REQUIRED</text><path d="M 96 424 L 96 445" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="40" y="448" width="1050" height="115" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="486" font-size="23" fill="#278d83" font-weight="700">P1-03</text><text x="183" y="483" font-size="24" fill="#163449" font-weight="650">Universal Iris + Optical Insert</text><text x="183" y="513" font-size="18" fill="#45616f" font-weight="400">Actual aperture, one real reference lens, locking and repeatability</text><text x="183" y="542" font-size="15" fill="#45616f" font-weight="700">REAL DATA / DETAIL REQUIRED</text><path d="M 96 564 L 96 585" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="40" y="588" width="1050" height="115" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="626" font-size="23" fill="#278d83" font-weight="700">P1-04</text><text x="183" y="623" font-size="24" fill="#163449" font-weight="650">DM22 Registration / Synchronization</text><text x="183" y="653" font-size="18" fill="#45616f" font-weight="400">Mounting, registration, sync and actual saved-image evidence</text><text x="183" y="682" font-size="15" fill="#45616f" font-weight="700">REAL DATA REQUIRED</text><path d="M 96 704 L 96 725" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="40" y="728" width="1050" height="115" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="766" font-size="23" fill="#278d83" font-weight="700">P1-05</text><text x="183" y="763" font-size="24" fill="#163449" font-weight="650">Electronics / Power / Range / UI</text><text x="183" y="793" font-size="18" fill="#45616f" font-weight="400">Hardware, D3 assistance, calibration, faults and operation</text><text x="183" y="822" font-size="15" fill="#45616f" font-weight="700">PHYSICAL IMPLEMENTATION REQUIRED</text><path d="M 96 844 L 96 865" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="40" y="868" width="1050" height="115" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="906" font-size="23" fill="#278d83" font-weight="700">P1-06</text><text x="183" y="903" font-size="24" fill="#163449" font-weight="650">P1 Master Integration</text><text x="183" y="933" font-size="18" fill="#45616f" font-weight="400">Matched interfaces and a testable complete shooting chain</text><text x="183" y="962" font-size="15" fill="#45616f" font-weight="700">INTEGRATION EVIDENCE REQUIRED</text><path d="M 96 984 L 96 1005" stroke="#507483" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="40" y="1008" width="1050" height="115" rx="14" fill="#ffffff" stroke="#c8d7de" stroke-width="2"/><text x="60" y="1046" font-size="23" fill="#278d83" font-weight="700">P1-07</text><text x="183" y="1043" font-size="24" fill="#163449" font-weight="650">Controlled Bench / Prototype Release Planning</text><text x="183" y="1073" font-size="18" fill="#45616f" font-weight="400">Bounded activity, measurements, stop conditions and review</text><text x="183" y="1102" font-size="15" fill="#45616f" font-weight="700">NOT AUTHORIZED BY THIS ROADMAP</text><text x="40" y="1202" font-size="21" fill="#835b1d" font-weight="700">Current shutter: NOT READY FOR CONTROLLED BENCH PLANNING</text><text x="40" y="1240" font-size="21" fill="#163449" font-weight="650">After reviewed physical execution and P1 function validation:</text><text x="40" y="1271" font-size="20" fill="#45616f" font-weight="400">POST-P1 LIGHTWEIGHT PRODUCT REDESIGN — deferred, not solved.</text></g></svg>
